# Netlify Configuration
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Ignore NEXT_PUBLIC vars in secrets scan (they are meant to be public)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Configurações de funções serverless
# parse-file: mais tempo para PDFs grandes (extração de texto)
# analyze-candidate: mais tempo para chamadas à API Gemini
[functions]
  node_bundler = "esbuild"
  # Timeout padrão aumentado para suportar PDFs pesados + Gemini
  # Netlify Pro/Enterprise: até 26s. Free: até 10s.
  # Se necessitar mais tempo, migrar parse-file para Background Function.
  included_files = ["node_modules/pdf-parse/lib/**", "node_modules/mammoth/**"]
